<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/product.css">
  <script type="module" src="/static/scripts/product.js"></script>
</head>

<body>
  <div class="header">
    <!-- <div class="add-product-btn">+</div> -->
    <form action="#">
      <div class="search-row">
        <label for="keyword">
          <img src="/static/images/search.png" alt="">
        </label>
        <input type="text" name="keyword" id="keyword" placeholder="請輸入商品名稱"
          autocomplete="off">
        <div id="suggestions">
          <!-- <div>日式無糖綠茶</div>
          <div>日式無糖綠茶</div>
          <div>日式無糖綠茶</div> -->
        </div>
      </div>
      <button type="submit">搜尋</button>
    </form>
    <div class="row">
      <div class="dropdown category">
        <button class="dropdown-btn category">
          <span class="title">類別</span>
          <span class="icon">▼</span>
        </button>
        <div class="dropdown-content category" style="display: none;">
          <!-- <div class="item">全部</div> -->
          <!-- <div class="item">食品</div> -->
          <!-- <div class="item">飲料</div> -->
        </div>
      </div>
      <div class="dropdown brand">
        <button class="dropdown-btn brand">
          <span class="title">品牌</span>
          <span class="icon">▼</span>
        </button>
        <div class="dropdown-content brand" style="display: none;">
          <!-- <div class="item">義美(166)</div>
          <div class="item">盛香珍(107)</div>
          <div class="item">新東陽(77)</div> -->
        </div>
      </div>
    </div>
    <img src="/static/images/sort.png" alt="" class="sort">
    <label for="personal">
      <img src="/static/images/user-unchecked.png" alt="" class="personal">
    </label>
    <input type="checkbox" name="personal" id="personal" style="display: none;">
    <!-- <div class="alert" style="display: flex;">提示框</div> -->
  </div>

  <div class="main"></div>

  <div class="add-product-btn">建立新商品</div>

  <div class="footer">
    <a href="/">首頁</a>
    <a href="/list">清單</a>
    <a href="/product">評論</a>
    <a href="/member">會員</a>
  </div>

  <div class="copy" style="display: none;">
    <div class="product" id="0">
      <img src="" alt="">
      <div class="describes">
        <h3 class="title">
          【品牌】名稱
        </h3>
        <div class="rating">
          <div class="stars">★★★★★
            <div class="value">★★★★★</div>
          </div>
          <div class="caption"><span>0</span>則評論</div>
        </div>
      </div>
    </div>
    <div class="alert" style="display: none;">提示框</div>
  </div>
  <div class="mask" style="display: none;"></div>
  <div class="add-product-dialog" style="display: none;">
    <div class="close-btn"></div>
    <form action="">
      <h2>建立商品</h2>
      <div class="row">
        <input type="text" id="category" name="category" placeholder="輸入商品類別"
          required>
      </div>
      <div class="row">
        <input type="text" id="brand" name="brand" placeholder="輸入品牌名稱"
          required>
      </div>
      <div class="row">
        <input type="text" id="name" name="name" placeholder="輸入商品名稱" required>
      </div>
      <div class="row">
        <label for="photo">上傳商品照片</label>
        <input type="file" id="photo" name="photo" accept="image/*" required>
      </div>
      <div class="row">
        <button type="submit">提交</button>
      </div>
    </form>
  </div>
</body>

</html>

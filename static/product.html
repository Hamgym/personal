<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/product.css">
  <script type="module" src="/static/scripts/product.js"></script>
</head>

<body>
  <div class="mask" style="display: none;"></div>
  <div class="add-product-dialog" style="display: none;">
    <div class="close-btn"></div>
    <form action="">
      <h2>建立商品</h2>
      <div class="row">
        <input type="text" id="category" name="category" placeholder="輸入商品類別"
          required>
      </div>
      <div class="row">
        <input type="text" id="brand" name="brand" placeholder="輸入品牌名稱"
          required>
      </div>
      <div class="row">
        <input type="text" id="name" name="name" placeholder="輸入商品名稱" required>
      </div>
      <div class="row">
        <button type="submit">提交</button>
        <!-- <button type="button" class="cancel">取消</button> -->
      </div>
    </form>
  </div>

  <div class="header">
    <!-- <div class="add-product-btn">+</div> -->
    <form action="#">
      <div class="search-row">
        <img src="/static/images/search.png" alt="">
        <input type="text" name="keyword" id="" placeholder="請輸入商品名稱">
      </div>
      <button type="submit">搜尋</button>
    </form>
    <div class="row">
      <div class="dropdown category">
        <button class="dropdown-btn category"><span>類別</span> ▼</button>
        <div class="dropdown-content category" style="display: none;">
          <!-- <div class="item">全部</div> -->
          <!-- <div class="item">食品</div> -->
          <!-- <div class="item">飲料</div> -->
        </div>
      </div>
      <div class="dropdown brand">
        <button class="dropdown-btn brand"><span>品牌</span> ▼</button>
        <div class="dropdown-content brand" style="display: none;">
          <div class="item">義美(166)</div>
          <div class="item">盛香珍(107)</div>
          <div class="item">新東陽(77)</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <!-- <div class="product">【茶裏王】日式無糖綠茶</div>
    <div class="product">【舒跑】運動飲料</div>
    <div class="product">【麥香】阿薩姆紅茶</div> -->
  </div>

  <div class="add-product-btn">建立新商品</div>

  <div class="footer">
    <a href="/">首頁</a>
    <a href="/list">清單</a>
    <a href="/product">評論</a>
    <a href="/member">會員</a>
  </div>
</body>

</html>

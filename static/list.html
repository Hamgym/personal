<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/list.css">
  <script type="module" src="/static/scripts/list.js"></script>
</head>

<body>
  <div class="mask"></div>
  <div class="signin-dialog">
    <div class="decorator-bar"></div>
    <div class="close"></div>
    <div class="signin-main">
      <h3>登入會員帳號</h3>
      <form action="" method="post">
        <input required type="email" name="email" placeholder="輸入電子信箱">
        <input required type="password" name="password" placeholder="輸入密碼"
          minlength="3">
        <input type="submit" value="登入帳戶">
        <p class="message" style="display:none">回應訊息</p>
        <div class="signup">還沒有帳戶？點此註冊</div>
      </form>
    </div>
  </div>
  <div class="signup-dialog">
    <div class="decorator-bar"></div>
    <div class="close"></div>
    <div class="signup-main">
      <h3>註冊會員帳號</h3>
      <form action="" method="post">
        <input required type="text" name="name" placeholder="輸入姓名"
          maxlength="20">
        <input required type="email" name="email" placeholder="輸入電子郵件">
        <input required type="password" name="password" placeholder="輸入密碼"
          minlength="3">
        <input type="submit" value="註冊新帳戶">
        <p class="message" style="display:none">回應訊息</p>
        <div class="signin">已經有帳戶了？點此登入</div>
      </form>
    </div>
  </div>

  <div class="header">
    <div class="add-item-btn">新增</div>
  </div>

  <div class="footer">
    <a href="/">首頁</a>
    <a href="/list">清單</a>
    <a href="/review">評價</a>
    <a href="/member">會員</a>
  </div>
</body>

</html>

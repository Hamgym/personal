<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/reivew.css">
  <script type="module" src="/static/scripts/review.js"></script>
</head>

<body>
  <div class="header">
    <div class="add-product">+</div>
    <form action="#">
      <input type="text" name="" id="" placeholder="請輸入商品名稱">
      <button type="submit">搜尋</button>
    </form>
    <div class="row">
      <div class="dropdown">
        <button class="dropdown-btn category">類別 ▼</button>
        <div class="dropdown-content category" style="display: none;">
          <div class="item">全部</div>
          <div class="item">食品</div>
          <div class="item">飲料</div>
        </div>
      </div>
      <div class="dropdown">
        <button class="dropdown-btn brand">品牌 ▼</button>
        <div class="dropdown-content brand" style="display: none;">
          <div class="item">義美(166)</div>
          <div class="item">盛香珍(107)</div>
          <div class="item">新東陽(77)</div>
        </div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="product">【茶裏王】日式無糖綠茶</div>
    <div class="product">【舒跑】運動飲料</div>
    <div class="product">【麥香】阿薩姆紅茶</div>
  </div>

  <div class="footer">
    <a href="/">首頁</a>
    <a href="/list">清單</a>
    <a href="/review">評論</a>
    <a href="/member">會員</a>
  </div>
</body>

</html>

<!DOCTYPE html>
<html lang="zh-Hant">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Index</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+Mono+TC&family=LXGW+WenKai+TC&family=Noto+Sans+TC:wght@100..900&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/static/styles/review.css">
  <script type="module" src="/static/scripts/review.js"></script>
</head>

<body>
  <div class="header">
    <div class="back-arrow"><img src="/static/images/back-arrow.png" alt="">
    </div>
    <div class="title">
      <!-- 【大醇豆】原味豆漿 -->
    </div>
  </div>

  <div class="summary">
    <div class="bar-area">
      <div class="row">
        <span>5</span>
        <div class="bar">
          <div class="value five"></div>
        </div>
      </div>
      <div class="row">
        <span>4</span>
        <div class="bar">
          <div class="value four"></div>
        </div>
      </div>
      <div class="row">
        <span>3</span>
        <div class="bar">
          <div class="value three"></div>
        </div>
      </div>
      <div class="row">
        <span>2</span>
        <div class="bar">
          <div class="value two"></div>
        </div>
      </div>
      <div class="row">
        <span>1</span>
        <div class="bar">
          <div class="value one"></div>
        </div>
      </div>
    </div>
    <div class="avg">
      <div class="score">4.6</div>
      <div class="stars">★★★★★
        <div class="value">★★★★★</div>
      </div>
      <div class="caption"><span>5</span>則評論</div>
    </div>
  </div>

  <div class="main">
    <div class="item" id="1">
      <div class="user">
        <div class="name">Ke-Jyun Lu</div>
        <div class="stars">★★★★★
          <div class="value">★★★★★</div>
        </div>
        <div class="date">2024/11/03</div>
        <div class="like">
          <div class="like-btn"><img src="/static/images/like-unfilled.png"
              alt=""></div>
          <span>5</span>
        </div>
      </div>
      <div class="content">
        <div class="text">從小喝到大，熟悉的麥香最對味。</div>
        <div class="image"><img src="/static/images/product-2.jpg" alt="">
        </div>
      </div>
    </div>
    <div class="item" id="2">
      <div class="user">
        <div class="name">匿名</div>
        <div class="stars">★★★★★
          <div class="value">★★★★★</div>
        </div>
        <div class="date">2024/11/03</div>
        <div class="like">
          <div class="like-btn"><img src="/static/images/like-unfilled.png"
              alt=""></div>
          <span>3</span>
        </div>
      </div>
      <div class="content">
        <div class="text">麥~My dear friend!麥~My dear friend!麥~My dear
          friend!麥~My dear friend!</div>
        <div class="image"><img src="/static/images/sample.jpg" alt="">
        </div>
      </div>
    </div>
  </div>

  <div class="post-btn">撰寫評論</div>

  <div class="footer">
    <a href="/">首頁</a>
    <a href="/list">清單</a>
    <a href="/product">評論</a>
    <a href="/member">會員</a>
  </div>
</body>

</html>
